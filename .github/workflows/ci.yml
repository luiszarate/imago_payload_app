name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    name: Core (Linux, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMAGO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  core-linux-sanitizers:
    name: Core (Linux, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DIMAGO_SANITIZE=ON -DIMAGO_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  core-macos:
    name: Core (macOS, Apple Clang) + Swift package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: CMake build and tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMAGO_WARNINGS_AS_ERRORS=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Swift package tests (macOS)
        run: swift test
      - name: Swift package build (iOS device)
        run: xcodebuild -scheme ImagoCore -destination 'generic/platform=iOS' -quiet build

  ios-app:
    name: iOS app (build, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen
      - name: Build for iOS devices
        run: |
          set -o pipefail
          xcodebuild -project apple/ImagoPayloadControl.xcodeproj -scheme ImagoPayloadControl \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build 2>&1 | tee ios-build.log
      # Compiler errors as annotations: readable on the run page and through the public API.
      - name: Report build errors
        if: failure()
        run: |
          grep -E 'error:' ios-build.log | sort -u | head -40 | while IFS= read -r line; do
            if [[ "$line" =~ ^$GITHUB_WORKSPACE/([^:]+):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
              echo "::error file=${BASH_REMATCH[1]},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
            else
              echo "::error::${line}"
            fi
          done
      - name: Build for the iOS Simulator
        run: >
          xcodebuild -project apple/ImagoPayloadControl.xcodeproj -scheme ImagoPayloadControl
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          CODE_SIGNING_ALLOWED=NO -quiet build
