name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    name: Core (Linux, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMAGO_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee core-test.log
      # Failed checks as annotations, readable through the public API (logs need a login).
      - name: Report test failures
        if: failure()
        run: |
          touch core-test.log
          grep -hE 'ERROR:|FATAL|values: |TEST CASE:|Sanitizer|runtime error' core-test.log \
            | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  core-linux-sanitizers:
    name: Core (Linux, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DIMAGO_SANITIZE=ON -DIMAGO_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build -j
      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee core-test.log
      # Failed checks as annotations, readable through the public API (logs need a login).
      - name: Report test failures
        if: failure()
        run: |
          touch core-test.log
          grep -hE 'ERROR:|FATAL|values: |TEST CASE:|Sanitizer|runtime error' core-test.log \
            | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  core-macos:
    name: Core (macOS, Apple Clang) + Swift package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: CMake build and tests
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMAGO_WARNINGS_AS_ERRORS=ON
          cmake --build build -j 2>&1 | tee core-build.log
          ctest --test-dir build --output-on-failure 2>&1 | tee core-test.log
      # Compiler errors and failed checks as annotations, readable through the public API.
      - name: Report build and test failures
        if: failure()
        run: |
          touch core-build.log core-test.log
          grep -hE 'error:|ERROR:|FATAL|values: |TEST CASE:|Sanitizer' core-build.log core-test.log \
            | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - name: Swift package tests (macOS)
        run: swift test
      - name: Swift package build (iOS device)
        run: xcodebuild -scheme ImagoCore -destination 'generic/platform=iOS' -quiet build

  ios-app:
    name: iOS app (build, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen
      - name: Build for iOS devices
        run: |
          set -o pipefail
          xcodebuild -project apple/ImagoPayloadControl.xcodeproj -scheme ImagoPayloadControl \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build 2>&1 | tee ios-build.log
      # Compiler errors as annotations: readable on the run page and through the public API.
      - name: Report build errors
        if: failure()
        run: |
          grep -E 'error:' ios-build.log | sort -u | head -40 | while IFS= read -r line; do
            if [[ "$line" =~ ^$GITHUB_WORKSPACE/([^:]+):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
              echo "::error file=${BASH_REMATCH[1]},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
            else
              echo "::error::${line}"
            fi
          done
      - name: Build for the iOS Simulator
        run: >
          xcodebuild -project apple/ImagoPayloadControl.xcodeproj -scheme ImagoPayloadControl
          -destination 'generic/platform=iOS Simulator' -configuration Debug
          CODE_SIGNING_ALLOWED=NO -quiet build

  android-app:
    name: Android app (build, tests, lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" \
            "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null
      # The Kotlin reader of the native state snapshot is tested against the current writer.
      - name: State snapshot fixture
        run: android/tools/make_state_fixture.sh
      - name: Build, unit tests and lint
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest lintDebug 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILED|Lint found' android/build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: imago-payload-control-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  desktop-linux:
    name: Desktop app (Linux, Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libavcodec-dev libavutil-dev libsdl2-dev libgl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 xvfb
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          modules: qtmultimedia
          cache: true
      - name: Build and test
        run: |
          set -o pipefail
          cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIMAGO_WARNINGS_AS_ERRORS=ON
          cmake --build desktop/build -j 2>&1 | tee desktop-build.log
          ctest --test-dir desktop/build --output-on-failure
      - name: Report build errors
        if: failure()
        run: |
          touch desktop-build.log
          grep -E 'error:|warning:' desktop-build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      # The app against the simulator on a virtual display, drawn by Mesa: a screenshot of the
      # whole window (video included) and of the decoded picture.
      - name: Smoke test against orus-sim
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIMAGO_BUILD_TESTS=OFF
          cmake --build build -j --target orus-sim
          ./build/tools/orus-sim/orus-sim --video tools/orus-sim/testdata/bars-720p30.h264 --heading 30 &
          sleep 1
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1280x800x24" ./desktop/build/ImagoPayloadControl \
            --profile "orus-sim on this computer" --connect --open hud --delay 8000 \
            --screenshot shots/desktop-linux.png | tee shots/desktop-linux.txt
          grep -q "video: true" shots/desktop-linux.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-linux-screenshots
          path: shots/
          retention-days: 14

  desktop-windows:
    name: Core + desktop app (Windows, MSVC)
    runs-on: windows-2025
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      # FFmpeg and SDL2 from vcpkg, cached between runs: FFmpeg takes minutes to build.
      - name: vcpkg cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('desktop/vcpkg.json') }}
      - name: Core build and tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p vcpkg-cache
          cmake -S . -B build
          cmake --build build --config Release -j 2>&1 | tee core-build.log
          ctest --test-dir build -C Release --output-on-failure 2>&1 | tee core-test.log
      - name: Desktop build and tests
        shell: bash
        run: |
          set -o pipefail
          cmake -S desktop -B desktop/build \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DFFMPEG_ROOT="$GITHUB_WORKSPACE/desktop/build/vcpkg_installed/x64-windows"
          cmake --build desktop/build --config Release -j 2>&1 | tee desktop-build.log
          ctest --test-dir desktop/build -C Release --output-on-failure
      - name: Report build and test failures
        if: failure()
        shell: bash
        run: |
          touch core-build.log core-test.log desktop-build.log
          grep -hE ': (fatal )?error|: warning C|TEST CASE:|values: |ERROR:' core-build.log core-test.log desktop-build.log \
            | sort -u | head -50 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - name: Package
        shell: bash
        run: |
          app=desktop/build/Release
          windeployqt --release --qmldir desktop/qml --no-translations "$app/ImagoPayloadControl.exe"
          mkdir -p "$app/licenses"
          cp desktop/resources/licenses/* "$app/licenses/"
          cp android/app/src/main/assets/licenses/* "$app/licenses/"
          cp desktop/resources/fonts/LICENSE-MaterialIcons.txt "$app/licenses/"
          rm -f "$app"/*.lib "$app"/*.exp
          mkdir -p package && cp -r "$app" package/ImagoPayloadControl
      - name: Smoke test against orus-sim
        shell: pwsh
        env:
          # A GUI application logs to the debugger unless told to use stderr.
          QT_FORCE_STDERR_LOGGING: 1
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $sim = Start-Process -PassThru -NoNewWindow build/tools/orus-sim/Release/orus-sim.exe `
            -ArgumentList '--video','tools/orus-sim/testdata/bars-720p30.h264','--heading','30'
          Start-Sleep -Seconds 1
          $app = Start-Process -PassThru -Wait -NoNewWindow `
            -RedirectStandardError shots/desktop-windows.txt `
            package/ImagoPayloadControl/ImagoPayloadControl.exe `
            -ArgumentList '--profile','"orus-sim on this computer"','--connect','--open','hud','--delay','8000','--screenshot','shots/desktop-windows.png'
          Stop-Process -Id $sim.Id
          Get-Content shots/desktop-windows.txt
          if (-not (Select-String -Quiet -Path shots/desktop-windows.txt -Pattern 'video: true')) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows-screenshots
          path: shots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: imago-payload-control-windows-x64
          path: package/
          retention-days: 14
