# Xcode project definition. Generate the project with:
#   brew install xcodegen && cd apple && xcodegen
# then open ImagoPayloadControl.xcodeproj. The .xcodeproj is generated, not committed.
name: ImagoPayloadControl
options:
  bundleIdPrefix: aero.imago
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ImagoCore:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ImagoPayloadControl:
    type: application
    platform: iOS
    sources:
      - path: ImagoPayloadControl
        excludes:
          - "Resources/Fonts/*.txt"
    dependencies:
      - package: ImagoCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: aero.imago.payloadcontrol
        PRODUCT_NAME: Imago Payload
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Set your Apple Developer team here or in Xcode (Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    info:
      path: ImagoPayloadControl/Info.plist
      properties:
        CFBundleDisplayName: Imago Payload
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Imago Payload Control connects to the Orus L payload and to the video downlink on your local network.
        UIAppFonts:
          - SpaceGrotesk-Variable.ttf
          - Manrope-Variable.ttf
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        ITSAppUsesNonExemptEncryption: false
