# Xcode project definition. Generate the project with:
#   brew install xcodegen && cd apple && xcodegen
# then open ImagoPayloadControl.xcodeproj. The .xcodeproj is generated, not committed.
name: ImagoPayloadControl
options:
  bundleIdPrefix: aero.imago
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ImagoCore:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ImagoPayloadControl:
    type: application
    platform: iOS
    sources:
      - path: ImagoPayloadControl
        excludes:
          - "Resources/Fonts/*.txt"
    dependencies:
      - package: ImagoCore
    postBuildScripts:
      # On the Mac, UIRequiresFullScreen and landscape-only orientations give a fixed-size
      # window; without them it resizes (down to MacSupport.minimumWindowSize). Runs before
      # code signing, so the signature covers the edited Info.plist.
      - name: Resizable window on the Mac
        basedOnDependencyAnalysis: false
        script: |
          [ "$EFFECTIVE_PLATFORM_NAME" = "-maccatalyst" ] || exit 0
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$plist" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$plist" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$plist" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" \
            -c "Add :UISupportedInterfaceOrientations: string UIInterfaceOrientationPortrait" \
            -c "Add :UISupportedInterfaceOrientations: string UIInterfaceOrientationPortraitUpsideDown" \
            -c "Add :UISupportedInterfaceOrientations: string UIInterfaceOrientationLandscapeLeft" \
            -c "Add :UISupportedInterfaceOrientations: string UIInterfaceOrientationLandscapeRight" \
            "$plist"
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: aero.imago.payloadcontrol
        PRODUCT_NAME: Imago Payload
        # iPhone, iPad, and the Mac through Mac Catalyst with the Mac idiom (6): controls at
        # the Mac's own size instead of the iPad's scaled to 77 %.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # The Mac app is distributed outside the App Store, notarized (scripts/build-mac.sh):
        # hardened runtime and the sandbox with network and gamepad access.
        ENABLE_HARDENED_RUNTIME: YES
        # The script above edits the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mac.entitlements
        CODE_SIGN_STYLE: Automatic
        # Set your Apple Developer team here or in Xcode (Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    info:
      path: ImagoPayloadControl/Info.plist
      properties:
        CFBundleDisplayName: Imago Payload
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Imago Payload Control connects to the Orus L payload and to the video downlink on your local network.
        UIAppFonts:
          - SpaceGrotesk-Variable.ttf
          - Manrope-Variable.ttf
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        ITSAppUsesNonExemptEncryption: false
        # MAVLink logs (Documents/Logs) show up in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
